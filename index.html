<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมุดบัญชีร้าน AhTao MuSpace 🌸✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fcf8f2; background-image: radial-gradient(#e6d5c3 1px, transparent 1px); background-size: 20px 20px; color: #5a4a5e; min-height: 100vh; }
        .card-notebook { background: #ffffff; border-radius: 2rem; box-shadow: 0 10px 25px rgba(244, 180, 217, 0.2); border: 3px solid #fce4ec; }
        .btn-pastel-pink { background: linear-gradient(135deg, #ffb6c1, #ff9bb3); color: white; transition: all 0.2s; }
        .btn-pastel-pink:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4); }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-6px) rotate(3deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        input:focus, select:focus { outline: none; border-color: #ffb6c1 !important; }
    </style>
</head>
<body class="py-8 px-4 flex items-center justify-center min-h-screen">

    <!-- หน้าล็อกอิน (แสดงเมื่อยังไม่เข้าสู่ระบบ) -->
    <div id="login-section" class="max-w-sm w-full card-notebook p-8 text-center relative">
        <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 text-4xl animate-float">🐱💖✨</div>
        <h2 class="text-xl font-bold text-[#d87093] mt-4 mb-1">AhTao MuSpace Login</h2>
        <p class="text-xs text-[#8c7894] mb-6">กรอกรหัสลับความรวยก่อนเข้าใช้งานนะจ๊ะ 🌸</p>
        
        <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-[#8c7894] mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" required placeholder="ahtao" class="w-full p-3 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
            </div>
            <div>
                <label class="block text-xs font-bold text-[#8c7894] mb-1">รหัสผ่าน (Password - 6 หลัก)</label>
                <input type="password" id="password" required placeholder="123456" class="w-full p-3 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
            </div>
            <div id="login-error" class="text-xs text-red-400 text-center hidden">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้องจ้า 🥲</div>
            <button type="submit" class="w-full btn-pastel-pink py-3 rounded-xl font-bold text-sm shadow-md mt-2">
                <i class="fa-solid fa-key"></i> เข้าสู่สมุดบัญชี ✨
            </button>
        </form>
    </div>

    <!-- หน้าแดชบอร์ดสมุดบัญชี (แสดงเมื่อเข้าสู่ระบบแล้ว) -->
    <div id="app-section" class="max-w-md w-full mx-auto relative hidden">
        
        <!-- กรอบชื่อร้านแบบตั้งตรงสวยๆ (ไม่โดนตัดขอบ) -->
        <div class="bg-[#ffb6c1] text-white p-6 rounded-[2rem] shadow-lg mb-6 text-center relative">
            <div class="absolute top-3 left-4 text-2xl animate-float">🐱✨</div>
            <div class="absolute bottom-3 right-4 text-2xl animate-float" style="animation-delay: 1.5s;">💖</div>
            <h1 class="text-2xl font-bold tracking-wide">AhTao MuSpace</h1>
            <p class="text-xs opacity-90 font-medium italic mt-1">“ ยิ่งเรารักษาเงิน เงินก็ยิ่งรักเรานะคนเก่ง 🌸 ”</p>
            <button onclick="handleLogout()" class="mt-3 text-[11px] bg-white text-[#d87093] px-3 py-1 rounded-full font-bold shadow-sm hover:bg-[#fff0f5]">
                <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
            </button>
        </div>

        <!-- กล่องสรุปยอดรวม -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="card-notebook p-3 text-center bg-[#fff0f5]">
                <div class="text-[11px] text-[#d87093] font-bold mb-1">รายรับรวม</div>
                <div id="total-income" class="text-md font-bold text-[#ff69b4]">0.-</div>
            </div>
            <div class="card-notebook p-3 text-center bg-[#f0f8ff]">
                <div class="text-[11px] text-[#4682b4] font-bold mb-1">รายจ่ายรวม</div>
                <div id="total-expense" class="text-md font-bold text-[#1e90ff]">0.-</div>
            </div>
            <div class="card-notebook p-3 text-center bg-[#fdf5e6]">
                <div class="text-[11px] text-[#daa520] font-bold mb-1">คงเหลือ</div>
                <div id="total-balance" class="text-md font-bold text-[#e6ac00]">0.-</div>
            </div>
        </div>

        <!-- ฟอร์มบันทึกรายการ -->
        <div class="card-notebook p-5 mb-6">
            <h2 class="text-md font-bold text-[#d87093] mb-3 flex items-center gap-2">
                <i class="fa-solid fa-pen-fancy"></i> จดบันทึกวันนี้
            </h2>
            <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-[#8c7894] mb-1">ประเภทรายการ</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center gap-2 p-2 border-2 border-[#ffb6c1] rounded-xl cursor-pointer text-sm font-bold text-[#d87093] bg-[#fff0f5] has-[:checked]:bg-[#ffb6c1] has-[:checked]:text-white transition-all">
                            <input type="radio" name="type" value="income" class="hidden" checked> 💰 รายรับ
                        </label>
                        <label class="flex items-center justify-center gap-2 p-2 border-2 border-[#add8e6] rounded-xl cursor-pointer text-sm font-bold text-[#4682b4] bg-[#f0f8ff] has-[:checked]:bg-[#add8e6] has-[:checked]:text-white transition-all">
                            <input type="radio" name="type" value="expense" class="hidden"> 💸 รายจ่าย
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#8c7894] mb-1">ชื่อรายการ</label>
                    <input type="text" id="desc" required placeholder="เช่น ค่าชาไข่มุก, เงินเดือนออก" class="w-full p-2.5 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-[#8c7894] mb-1">หมวดหมู่</label>
                        <select id="category" class="w-full p-2.5 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                            <option value="ของกิน 🍔">ของกิน 🍔</option>
                            <option value="เดินทาง 🚗">เดินทาง 🚗</option>
                            <option value="ช้อปปิ้ง 🛍️">ช้อปปิ้ง 🛍️</option>
                            <option value="รายรับ 💵">รายรับ 💵</option>
                            <option value="อื่นๆ ✨">อื่นๆ ✨</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#8c7894] mb-1">จำนวนเงิน (บาท)</label>
                        <input type="number" id="amount" required step="any" placeholder="0.00" class="w-full p-2.5 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                    </div>
                </div>
                <button type="submit" class="w-full btn-pastel-pink py-3 rounded-xl font-bold text-sm shadow-sm flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-heart"></i> บันทึกรายการ
                </button>
            </form>
        </div>

        <!-- กราฟสรุปยอด -->
        <div class="card-notebook p-5 mb-6">
            <h2 class="text-md font-bold text-[#d87093] mb-3 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie"></i> สัดส่วนรายรับ-รายจ่าย
            </h2>
            <div class="relative h-48 flex items-center justify-center">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- รายการล่าสุด -->
        <div class="card-notebook p-5 mb-12">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-bold text-[#d87093] flex items-center gap-2">
                    <i class="fa-solid fa-list-ul"></i> ประวัติรายการ
                </h2>
                <button onclick="clearData()" class="text-xs text-red-400 hover:text-red-600 font-bold">ล้างข้อมูลทั้งหมด</button>
            </div>
            <div id="transaction-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
        </div>

    </div>

    <script>
        // ระบบล็อกอินสเกลความปลอดภัย
        function checkAuth() {
            const isLogged = localStorage.getItem('ahtao_logged_in');
            if (isLogged === 'true') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                init();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('login-error');

            if (u === 'ahtao' && p === '123456') {
                localStorage.setItem('ahtao_logged_in', 'true');
                err.classList.add('hidden');
                checkAuth();
            } else {
                err.classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('ahtao_logged_in');
            checkAuth();
        }

        let transactions = JSON.parse(localStorage.getItem('ahtao_acc_data')) || [];
        let myChart = null;

        function init() {
            renderTransactions();
            updateSummary();
            renderChart();
        }

        function addTransaction(e) {
            e.preventDefault();
            const type = document.querySelector('input[name="type"]:checked').value;
            const desc = document.getElementById('desc').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (isNaN(amount) || amount <= 0) return;

            transactions.unshift({
                id: Date.now(),
                type,
                desc,
                category,
                amount,
                date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })
            });
            saveAndRefresh();
            document.getElementById('transaction-form').reset();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(item => item.id !== id);
            saveAndRefresh();
        }

        function clearData() {
            if(confirm("ต้องการล้างประวัติทั้งหมดจริงหรือเปล่าคะ?")) {
                transactions = [];
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('ahtao_acc_data', JSON.stringify(transactions));
            renderTransactions();
            updateSummary();
            renderChart();
        }

        function renderTransactions() {
            const listEl = document.getElementById('transaction-list');
            if (transactions.length === 0) {
                listEl.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">ยังไม่มีรายการบันทึก เริ่มจดกันเลย! 🌸</p>`;
                return;
            }
            let html = '';
            transactions.forEach(item => {
                const isIncome = item.type === 'income';
                html += `
                    <div class="flex justify-between items-center p-2.5 ${isIncome ? 'bg-[#fff0f5]' : 'bg-[#f0f8ff]'} rounded-xl border border-[#fce4ec]">
                        <div class="flex items-center gap-2">
                            <span class="text-xs bg-white px-2 py-1 rounded-lg text-[#8c7894] font-medium">${item.date}</span>
                            <div>
                                <div class="text-sm font-bold text-[#5a4a5e]">${item.desc}</div>
                                <div class="text-[11px] text-[#8c7894]">${item.category}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-bold ${isIncome ? 'text-[#ff69b4]' : 'text-[#4682b4]'}">${isIncome ? '+' : '-'}${item.amount.toLocaleString()}.-</span>
                            <button onclick="deleteTransaction(${item.id})" class="text-gray-300 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            listEl.innerHTML = html;
        }

        function updateSummary() {
            let income = 0, expense = 0;
            transactions.forEach(item => {
                if (item.type === 'income') income += item.amount;
                else expense += item.amount;
            });
            document.getElementById('total-income').textContent = income.toLocaleString() + '.-';
            document.getElementById('total-expense').textContent = expense.toLocaleString() + '.-';
            document.getElementById('total-balance').textContent = (income - expense).toLocaleString() + '.-';
        }

        function renderChart() {
            let income = 0, expense = 0;
            transactions.forEach(item => {
                if (item.type === 'income') income += item.amount;
                else expense += item.amount;
            });
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['รายรับ', 'รายจ่าย'],
                    datasets: [{
                        data: [income > 0 || expense > 0 ? income : 1, expense],
                        backgroundColor: ['#ffb6c1', '#add8e6'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { family: 'Kanit', size: 12 }, color: '#5a4a5e' } } },
                    cutout: '65%'
                }
            });
        }

        // เช็กสิทธิ์ล็อกอินตอนเปิดเว็บ
        checkAuth();
    </script>
</body>
</html>
