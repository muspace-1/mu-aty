<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhTao MuSpace | สมุดบัญชีโปร 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fcf8f2; background-image: radial-gradient(#e6d5c3 1px, transparent 1px); background-size: 20px 20px; color: #5a4a5e; min-height: 100vh; position: relative; }
        .card-notebook { background: #ffffff; border-radius: 2rem; box-shadow: 0 10px 25px rgba(244, 180, 217, 0.2); border: 3px solid #fce4ec; }
        .btn-pastel-pink { background: linear-gradient(135deg, #ffb6c1, #ff9bb3); color: white; transition: all 0.2s; }
        .solid-heart { position: absolute; width: 15px; height: 15px; background-color: #ffb6c1; transform: rotate(-45deg); opacity: 0; pointer-events: none; z-index: 1; }
        .solid-heart::before, .solid-heart::after { content: ''; position: absolute; width: 15px; height: 15px; border-radius: 50%; background-color: #ffb6c1; }
        .solid-heart::before { top: -8px; left: 0; }
        .solid-heart::after { left: 8px; top: 0; }
        @keyframes float-fade { 0% { transform: translateY(0) rotate(-45deg) scale(0); opacity: 0; } 50% { opacity: 0.6; } 100% { transform: translateY(-100px) rotate(-45deg) scale(1); opacity: 0; } }
        .animate-float-fade { animation: float-fade 5s ease-in-out infinite; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ffb6c1; color: white; padding: 10px 20px; border-radius: 99px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 999; }
    </style>
</head>
<body class="py-8 px-4 flex items-center justify-center min-h-screen">

    <!-- ตกแต่งหัวใจลอย -->
    <div class="solid-heart animate-float-fade" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
    <div class="solid-heart animate-float-fade" style="top: 70%; right: 10%; animation-delay: 2.5s;"></div>

    <div id="toast">บันทึกสำเร็จ! 🌸</div>

    <!-- Login -->
    <div id="login-section" class="max-w-sm w-full card-notebook p-8 text-center">
        <h2 class="text-xl font-bold text-[#d87093] mb-4">AhTao MuSpace 🌸</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
            <input type="text" id="username" required placeholder="Username" class="w-full p-3 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
            <input type="password" id="password" required placeholder="Password" class="w-full p-3 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
            <button type="submit" class="w-full btn-pastel-pink py-3 rounded-xl font-bold text-sm">เข้าสู่ระบบ ✨</button>
        </form>
    </div>

    <!-- Dashboard -->
    <div id="app-section" class="max-w-md w-full mx-auto relative hidden space-y-6">
        <div class="bg-[#ffb6c1] text-white p-6 rounded-[2rem] shadow-lg text-center">
            <h1 class="text-2xl font-bold">AhTao MuSpace</h1>
            <p class="text-xs opacity-90 mt-1">“ รวยปังๆ ด้วยสมุดบัญชีสุดคิ้วท์ 🌸 ”</p>
            <button onclick="handleLogout()" class="mt-3 text-[10px] bg-white text-[#d87093] px-3 py-1 rounded-full font-bold">ออกจากระบบ</button>
        </div>

        <!-- เป้าหมาย & สรุป -->
        <div class="card-notebook p-5">
            <h3 class="text-xs font-bold text-[#d87093] mb-2">🎯 เป้าหมาย: <span id="goal-title-show">...</span></h3>
            <div class="w-full bg-[#f3d9ce] rounded-full h-3"><div id="goal-progress-bar" class="bg-gradient-to-r from-[#ffb6c1] to-[#ff69b4] h-3 rounded-full" style="width: 0%"></div></div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="card-notebook p-3 text-center bg-[#fff0f5]"><div class="text-[10px] font-bold">รายรับ</div><div id="total-income" class="text-sm font-bold text-[#ff69b4]">0</div></div>
            <div class="card-notebook p-3 text-center bg-[#f0f8ff]"><div class="text-[10px] font-bold">รายจ่าย</div><div id="total-expense" class="text-sm font-bold text-[#1e90ff]">0</div></div>
            <div class="card-notebook p-3 text-center bg-[#fdf5e6]"><div class="text-[10px] font-bold">คงเหลือ</div><div id="total-balance" class="text-sm font-bold text-[#e6ac00]">0</div></div>
        </div>

        <!-- ฟอร์ม -->
        <div class="card-notebook p-5">
            <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-2"><label class="flex justify-center p-2 rounded-xl cursor-pointer bg-[#fff0f5] border-2 border-[#ffb6c1] has-[:checked]:bg-[#ffb6c1] has-[:checked]:text-white font-bold text-xs"><input type="radio" name="type" value="income" class="hidden" checked> 💰 รายรับ</label><label class="flex justify-center p-2 rounded-xl cursor-pointer bg-[#f0f8ff] border-2 border-[#add8e6] has-[:checked]:bg-[#add8e6] has-[:checked]:text-white font-bold text-xs"><input type="radio" name="type" value="expense" class="hidden"> 💸 รายจ่าย</label></div>
                <input type="text" id="desc" required placeholder="ชื่อรายการ" class="w-full p-2 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                <div class="grid grid-cols-2 gap-2">
                    <select id="category" class="w-full p-2 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl"></select>
                    <input type="number" id="amount" required placeholder="จำนวนเงิน" class="w-full p-2 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                </div>
                <button type="submit" class="w-full btn-pastel-pink py-3 rounded-xl font-bold text-sm">บันทึกรายการ</button>
            </form>
        </div>

        <!-- ปฏิทิน -->
        <div class="card-notebook p-5">
            <h2 class="text-md font-bold text-[#d87093] mb-3 text-center">📅 ปฏิทินรายการ</h2>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
        </div>

        <!-- รายการ -->
        <div class="card-notebook p-5">
            <div class="flex gap-2 mb-3"><input type="text" id="search-box" oninput="renderTransactions()" placeholder="🔍 ค้นหา..." class="w-full p-2 text-xs bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl"></div>
            <div id="transaction-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // Data
        let transactions = JSON.parse(localStorage.getItem('ahtao_acc_data')) || [];
        let categories = JSON.parse(localStorage.getItem('ahtao_categories')) || ['ของกิน 🍔', 'เดินทาง 🚗', 'ช้อปปิ้ง 🛍️'];
        let goal = JSON.parse(localStorage.getItem('ahtao_goal')) || { title: 'เป้าหมาย', target: 5000 };
        let selectedDate = null;

        function showToast(m) { const t=document.getElementById('toast'); t.innerText=m; t.style.opacity=1; setTimeout(()=>t.style.opacity=0, 2000); }
        function handleLogin(e) { e.preventDefault(); if(document.getElementById('username').value==='ahtao' && document.getElementById('password').value==='123456') { localStorage.setItem('ahtao_logged_in','true'); location.reload(); } else alert('รหัสผิด'); }
        function handleLogout() { localStorage.removeItem('ahtao_logged_in'); location.reload(); }
        
        function init() { if(localStorage.getItem('ahtao_logged_in')==='true') { document.getElementById('login-section').classList.add('hidden'); document.getElementById('app-section').classList.remove('hidden'); render(); } }
        
        function render() {
            document.getElementById('category').innerHTML = categories.map(c=>`<option>${c}</option>`).join('');
            renderCalendar();
            renderTransactions();
            updateSummary();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            for(let i=1; i<=30; i++) {
                const day = i;
                const hasData = transactions.some(t => parseInt(t.date.split('/')[0]) === i);
                grid.innerHTML += `<div onclick="filterByDate(${i})" class="p-2 border rounded-lg cursor-pointer ${hasData ? 'bg-pink-100 font-bold' : ''}">${i}</div>`;
            }
        }

        function filterByDate(day) { selectedDate = day; renderTransactions(); }

        function renderTransactions() {
            const s = document.getElementById('search-box').value.toLowerCase();
            let list = transactions.filter(i => i.desc.toLowerCase().includes(s));
            if(selectedDate) list = list.filter(i => parseInt(i.date.split('/')[0]) === selectedDate);
            
            document.getElementById('transaction-list').innerHTML = list.map(i => `
                <div class="flex justify-between p-2 rounded-lg ${i.type==='income'?'bg-pink-50':'bg-blue-50'} text-xs">
                    <div><b>${i.desc}</b><br>${i.date}</div>
                    <div>${i.type==='income'?'+':'-'}${i.amount.toLocaleString()}</div>
                    <button onclick="deleteTransaction(${i.id})"><i class="fa fa-trash text-gray-400"></i></button>
                </div>`).join('');
        }

        function addTransaction(e) {
            e.preventDefault();
            transactions.unshift({ id:Date.now(), type:document.querySelector('input[name="type"]:checked').value, desc:document.getElementById('desc').value, category:document.getElementById('category').value, amount:parseFloat(document.getElementById('amount').value), date: (new Date().getDate()) + '/8' });
            localStorage.setItem('ahtao_acc_data', JSON.stringify(transactions));
            render(); showToast("บันทึกแล้ว! 🌸");
        }

        function deleteTransaction(id) { transactions=transactions.filter(i=>i.id!==id); localStorage.setItem('ahtao_acc_data', JSON.stringify(transactions)); render(); }
        function updateSummary() {
            let inc = transactions.filter(i=>i.type==='income').reduce((a,b)=>a+b.amount,0);
            let exp = transactions.filter(i=>i.type==='expense').reduce((a,b)=>a+b.amount,0);
            document.getElementById('total-income').innerText = inc.toLocaleString();
            document.getElementById('total-expense').innerText = exp.toLocaleString();
            document.getElementById('total-balance').innerText = (inc-exp).toLocaleString();
            let p = Math.min(((inc-exp)/goal.target)*100, 100);
            document.getElementById('goal-progress-bar').style.width = p + '%';
        }

        init();
    </script>
</body>
</html>
