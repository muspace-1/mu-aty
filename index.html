<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมุดบัญชีร้าน AhTao MuSpace 🌸✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fcf8f2; color: #5a4a5e; min-height: 100vh; }
        .card-notebook { background: #ffffff; border-radius: 2rem; box-shadow: 0 8px 20px rgba(255, 182, 193, 0.15); border: 2px solid #fff0f5; }
        .btn-pastel-pink { background: linear-gradient(135deg, #ffb6c1, #ff9bb3); color: white; }
        .btn-pastel-pink:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4); }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body class="py-6 px-4">

    <div class="max-w-md mx-auto">
        
        <!-- กรอบชื่อร้านแบบทึบ (Solid Header) -->
        <div class="bg-[#ffb6c1] text-white p-6 rounded-[2rem] shadow-lg mb-6 text-center transform -rotate-1 relative overflow-hidden">
            <div class="absolute top-2 left-2 text-2xl animate-float">🐱</div>
            <h1 class="text-2xl font-bold tracking-wide">AhTao MuSpace</h1>
            <p class="text-sm opacity-90 font-medium italic">Accounting Book 🌸</p>
        </div>

        <!-- กล่องสรุปยอด -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="card-notebook p-3 text-center bg-[#fff0f5]">
                <div class="text-[10px] text-[#d87093] font-bold">รายรับ</div>
                <div id="total-income" class="text-md font-bold text-[#ff69b4]">0</div>
            </div>
            <div class="card-notebook p-3 text-center bg-[#f0f8ff]">
                <div class="text-[10px] text-[#4682b4] font-bold">รายจ่าย</div>
                <div id="total-expense" class="text-md font-bold text-[#1e90ff]">0</div>
            </div>
            <div class="card-notebook p-3 text-center bg-[#fdf5e6]">
                <div class="text-[10px] text-[#daa520] font-bold">คงเหลือ</div>
                <div id="total-balance" class="text-md font-bold text-[#e6ac00]">0</div>
            </div>
        </div>

        <!-- ฟอร์มบันทึก -->
        <div class="card-notebook p-5 mb-6">
            <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex items-center justify-center gap-2 p-2 rounded-xl cursor-pointer text-sm font-bold border-2 border-[#ffb6c1] bg-[#fff0f5] text-[#d87093] has-[:checked]:bg-[#ffb6c1] has-[:checked]:text-white">
                        <input type="radio" name="type" value="income" class="hidden" checked> 💰 รับ
                    </label>
                    <label class="flex items-center justify-center gap-2 p-2 rounded-xl cursor-pointer text-sm font-bold border-2 border-[#add8e6] bg-[#f0f8ff] text-[#4682b4] has-[:checked]:bg-[#add8e6] has-[:checked]:text-white">
                        <input type="radio" name="type" value="expense" class="hidden"> 💸 จ่าย
                    </label>
                </div>
                <input type="text" id="desc" required placeholder="ชื่อรายการ..." class="w-full p-3 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                <div class="grid grid-cols-2 gap-2">
                    <select id="category" class="p-3 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                        <option value="ของกิน 🍔">ของกิน</option>
                        <option value="เดินทาง 🚗">เดินทาง</option>
                        <option value="ช้อปปิ้ง 🛍️">ช้อปปิ้ง</option>
                        <option value="รายรับ 💵">รายรับ</option>
                    </select>
                    <input type="number" id="amount" required placeholder="จำนวนเงิน" class="w-full p-3 text-sm bg-[#faf5f0] border-2 border-[#f3d9ce] rounded-xl">
                </div>
                <button type="submit" class="w-full btn-pastel-pink py-3 rounded-xl font-bold text-sm shadow-md">บันทึกรายการ ✨</button>
            </form>
        </div>

        <div class="card-notebook p-5 mb-12">
            <h2 class="text-sm font-bold text-[#d87093] mb-3">รายการล่าสุด 🐾</h2>
            <div id="transaction-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // ระบบกันพัง: เช็กข้อมูลก่อนดึง
        let transactions = [];
        try {
            const saved = localStorage.getItem('ahtao_acc_data');
            transactions = saved ? JSON.parse(saved) : [];
        } catch(e) { transactions = []; }

        function addTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            
            // กันพัง: ตรวจสอบจำนวนเงิน
            if (isNaN(amount) || amount <= 0) { alert("กรุณาระบุจำนวนเงินที่ถูกต้องค่ะ 🌸"); return; }

            const newItem = {
                id: Date.now(),
                type: document.querySelector('input[name="type"]:checked').value,
                desc: document.getElementById('desc').value,
                category: document.getElementById('category').value,
                amount: amount,
                date: new Date().toLocaleDateString('th-TH', {day:'numeric', month:'short'})
            };

            transactions.unshift(newItem);
            saveAndRefresh();
            document.getElementById('transaction-form').reset();
        }

        function saveAndRefresh() {
            localStorage.setItem('ahtao_acc_data', JSON.stringify(transactions));
            render();
        }

        function render() {
            const listEl = document.getElementById('transaction-list');
            let html = '';
            let income = 0, expense = 0;

            transactions.forEach(item => {
                if(item.type === 'income') income += item.amount; else expense += item.amount;
                
                html += `
                    <div class="flex justify-between items-center p-3 rounded-xl border border-pink-50 ${item.type === 'income' ? 'bg-pink-50' : 'bg-blue-50'}">
                        <div class="text-xs">
                            <span class="font-bold text-[#5a4a5e]">${item.desc}</span><br>
                            <span class="text-[10px] opacity-70">${item.category} • ${item.date}</span>
                        </div>
                        <div class="text-sm font-bold ${item.type === 'income' ? 'text-pink-500' : 'text-blue-500'}">
                            ${item.type === 'income' ? '+' : '-'}${item.amount.toLocaleString()}
                        </div>
                    </div>`;
            });
            listEl.innerHTML = html || '<p class="text-center text-xs opacity-50">ยังไม่มีรายการค่ะ 🐱</p>';
            
            document.getElementById('total-income').textContent = income.toLocaleString();
            document.getElementById('total-expense').textContent = expense.toLocaleString();
            document.getElementById('total-balance').textContent = (income - expense).toLocaleString();
        }
        render();
    </script>
</body>
</html>
